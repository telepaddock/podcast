<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Tele Paddock · TikTok</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;background:#111;color:#eee}
code{display:block;word-break:break-all;background:#222;padding:12px;border-radius:8px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style></head>
<body><h1>Tele Paddock Publisher</h1><div id="out"></div>
<script>
const p = new URLSearchParams(location.search), out = document.getElementById("out");
if (p.get("error")) { out.textContent = "Autorização negada: " + p.get("error_description"); }
else if (p.get("code")) {
  out.innerHTML = "<p>Autorização concluída. Copie o código abaixo e cole no arquivo indicado pelo assistente (ele expira em poucos minutos).</p><code id=c></code><button id=b>Copiar</button>";
  document.getElementById("c").textContent = p.get("code");
  document.getElementById("b").onclick = () => navigator.clipboard.writeText(p.get("code")).then(() => b.textContent = "Copiado ✓");
} else { out.textContent = "Página de retorno da autorização do TikTok para a publicação dos cortes do podcast Tele Paddock."; }
</script></body></html>
